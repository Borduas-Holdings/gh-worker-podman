name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    # No `tags: v*` trigger: a tag can be pushed from any commit, so a tag run must not
    # receive the push token. Publishing release tags again needs a tag-scoped environment
    # policy, which is the owner's call.
  schedule:
    - cron: '0 0 * * 0'  # Weekly rebuild on Sunday at midnight UTC
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE: jobordu/gh-worker-podman

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # ⛔ The Docker Hub WRITE token is DOCKERHUB_PUSH_TOKEN, a secret of the main-only
    # `dockerhub-push` environment (infrastructure/github/environments/main.tf). This job enters
    # it only on main's own push / schedule / dispatch; a dispatch from any other branch gets ''
    # (no environment, no token) and builds without pushing. A DISTINCT name, never the org-wide
    # DOCKERHUB_TOKEN, so nothing can fall back to it. tests/test_dockerhub_push_token_is_main_only.py.
    environment: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && 'dockerhub-push' || '' }}
    env:
      PUSH_ENVIRONMENT: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && 'dockerhub-push' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUSH_ENVIRONMENT == 'dockerhub-push'
        uses: docker/login-action@v3
        with:
          # The account that owns the image namespace (jobordu/gh-worker-podman), not a secret.
          username: jobordu
          password: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}

      - name: Generate build date
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}+${{ steps.date.outputs.date }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH_ENVIRONMENT == 'dockerhub-push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

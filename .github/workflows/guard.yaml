name: Guard - Docker Hub push token is main-only

# Static checks only: no secret, no environment, read-only token. Safe on pull_request.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run the guard tests
        run: |
          python -m pip install --quiet "pytest==8.3.5" "PyYAML==6.0.2"
          python -m pytest -q tests
